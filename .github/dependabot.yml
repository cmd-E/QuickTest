version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/QuickTest"
      - "/QuickTest.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Keep the application's and tests' Syncfusion packages in sync.
      syncfusion:
        patterns:
          - "Syncfusion.*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
